name: Synchronizacja CoC

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config.json', 'sync.mjs', '.github/workflows/sync.yml']

permissions:
  contents: write

concurrency:
  group: coc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pobierz dane z API Clash of Clans
        run: node sync.mjs
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
      - name: Zapisz wynik
        if: always()
        run: |
          git config user.name "coc-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync.json state.json
          git diff --cached --quiet || (git commit -m "sync $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
