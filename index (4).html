<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="panel-mode" content="public">
<title>Panel Klanu CoC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Sztab wojenny nocą: granatowe tło, złoto dla klanu głównego, eliksir dla akademii. Pasek boczny + obszar roboczy. */
  --bg:#10141c; --panel:#171d29; --panel2:#1f2636; --line:#2c3549; --ink:#ece6d6; --muted:#8f98ac;
  --gold:#f2b53a; --elixir:#c86ae0;
  --accent:var(--gold); --accent-ink:#1b1306; --accent-soft:rgba(242,181,58,.14);
  --ok:#4cc27a; --warn:#ef8a3c; --bad:#ec5a55;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
body.academy{--accent:var(--elixir); --accent-ink:#1d0a22; --accent-soft:rgba(200,106,224,.15)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.3px;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:18px}
a{color:var(--accent)}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;min-height:100%}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151b27,#121722);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.crest{width:38px;height:38px;flex:none}
.brand h1{font-size:22px;line-height:1}
.brand small{display:block;color:var(--muted);font-family:var(--cond);font-size:14px;letter-spacing:.4px}
.switch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-left:auto}
.switch button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:7px}
.switch button .dot{width:9px;height:9px;border-radius:50%}
.switch button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sync{font-family:var(--cond);font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--accent)} .sync.err i{background:var(--bad)} .sync.demo i{background:var(--warn)}

nav.side{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:63px;align-self:start;height:calc(100vh - 63px);overflow:auto}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
nav.side a svg{width:18px;height:18px;flex:none;opacity:.85}
nav.side a:hover{background:var(--panel);color:var(--ink)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
nav.side a .badge{margin-left:auto}
nav.side .sep{height:1px;background:var(--line);margin:10px 8px}
main{padding:22px 26px 60px;min-width:0;max-width:1400px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;background:var(--bg);z-index:15}
  nav.side a{white-space:nowrap;padding:8px 10px}
  nav.side a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  nav.side .sep{display:none}
  header.top{position:static;padding:10px 16px}
  .switch{margin-left:0}
  main{padding:16px}
}

/* ---------- building blocks ---------- */
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card > h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card > h3 .sub{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:auto;font-weight:500}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.tile .k{font-family:var(--cond);color:var(--muted);font-size:14px;letter-spacing:.5px;text-transform:uppercase}
.tile .v{font-family:var(--display);font-size:32px;line-height:1.1;margin-top:4px}
.tile .v small{font-size:17px;color:var(--muted)}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile.hot{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.tile.hot::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}

.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#3d4862;background:#252d40}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(236,90,85,.4)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
body.public button[disabled],body.public a[data-act="tplgo"],body.public .iconbtn{display:none}
body.public tr.click{cursor:default}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px}
.iconbtn:hover{color:var(--ink);background:var(--panel2)}

input[type=text],input[type=number],input[type=search],input[type=date],input[type=datetime-local],select,textarea{background:#121824;border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{width:100%;resize:vertical;line-height:1.5}
select{cursor:pointer}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-weight:500;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > label.f{flex:1 1 140px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:#141a26;position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.018)}
tbody tr:hover td{background:rgba(255,255,255,.04)}
td.n,th.n{text-align:right}
td.c,th.c{text-align:center}
tr.click{cursor:pointer}
td input[type=number]{width:78px;padding:4px 7px}
td select{padding:4px 6px}
.name{font-weight:700}
.tag{font-family:var(--cond);color:var(--muted);font-size:13px;margin-left:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.th{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:2px 7px;border-radius:7px;font-family:var(--cond);font-weight:700;font-size:14px;background:#263049;color:#cfd7ea}
.th.t18,.th.t17{background:#3b2b4d;color:#e7cff5}.th.t16,.th.t15{background:#2c3b52;color:#cde0ff}.th.t14,.th.t13{background:#2a4440;color:#c9f1e4}.th.t12,.th.t11{background:#45391f;color:#f6e1b0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:rgba(76,194,122,.13);color:var(--ok);border-color:rgba(76,194,122,.3)}
.pill.warn{background:rgba(239,138,60,.13);color:var(--warn);border-color:rgba(239,138,60,.3)}
.pill.bad{background:rgba(236,90,85,.14);color:var(--bad);border-color:rgba(236,90,85,.35)}
.pill.neu{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;font-weight:700}
.stars{letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars b{color:var(--gold);font-weight:400}
.stars i{color:#3a4358;font-style:normal}
.heroes{display:flex;gap:4px}
.heroes span{font-family:var(--cond);font-size:13px;background:#141a26;border:1px solid var(--line);border-radius:6px;padding:0 4px;min-width:28px;text-align:center}
.heroes span.z{color:#4a5368}
.bar{height:8px;border-radius:99px;background:#232b3c;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok > i{background:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list > div{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list > div:last-child{border-bottom:0}
.sev{width:4px;align-self:stretch;border-radius:4px;flex:none}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.acc{background:var(--accent)}.sev.neu{background:var(--line)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid rgba(239,138,60,.4);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner strong{color:var(--warn)}
.banner .actions{margin-left:auto;display:flex;gap:8px}

/* ---------- war ---------- */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;background:radial-gradient(120% 140% at 50% 0%,var(--accent-soft),transparent 60%),var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.side-us,.side-them{display:flex;flex-direction:column;gap:2px}
.side-them{text-align:right;align-items:flex-end}
.side-us .cn,.side-them .cn{font-family:var(--display);font-size:20px}
.bigscore{font-family:var(--display);font-size:44px;line-height:1;display:flex;align-items:center;gap:14px}
.bigscore .vs{font-size:16px;color:var(--muted)}
.bigscore .st{color:var(--gold)}
.center{text-align:center}
.warcols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1380px){.warcols{grid-template-columns:1fr}.warcols .emap{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}
.atk{display:flex;align-items:center;gap:5px}
.atk select.tg{width:60px;padding:4px 4px}
.atk select.st{width:56px;padding:4px 4px}
.atk input{width:52px !important;padding:4px 6px}
.war td{padding:6px 8px}
.atk.done select.st{border-color:rgba(76,194,122,.5)}
.atk.miss select.st{border-color:rgba(236,90,85,.5)}
.emap{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px}
.base{border:1px solid var(--line);background:#141a26;border-radius:10px;padding:7px 8px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.base .p{font-family:var(--display);font-size:16px}
.base.s3{border-color:rgba(76,194,122,.5);background:rgba(76,194,122,.07)}
.base.s2{border-color:rgba(242,181,58,.4)}
.base select{padding:2px 4px;font-size:12.5px}

/* ---------- cwl ---------- */
.cwl table{width:100%}
.cwl th,.cwl td{padding:6px 4px}
.cwl th.pl,.cwl td.pl{padding-left:12px;width:1%;min-width:150px;max-width:190px}
.cwl td.pl{white-space:normal}
.pln{display:flex;align-items:center;gap:5px;min-width:0}
.pln .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;display:block}
.th.sm{min-width:0;font-size:11.5px;padding:0 5px;border-radius:5px;margin-top:2px}
.rk{font-family:var(--cond);font-size:12px;color:var(--muted);margin-left:6px}
.cwl th.rnd{text-align:center;vertical-align:top;text-transform:none;letter-spacing:0;min-width:54px}
.rnd .rn{font-family:var(--display);font-size:16px;color:var(--ink);font-weight:400;line-height:1.1}
.rnd .ren{font-family:var(--body);font-size:11.5px;font-weight:500;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:3px auto 0;color:var(--muted)}
.rp{display:inline-block;margin-top:3px;font-family:var(--body);font-size:11.5px;font-weight:700;padding:0 7px;border-radius:99px;line-height:18px}
.rp.ok{background:rgba(76,194,122,.18);color:var(--ok)}.rp.bad{background:rgba(236,90,85,.18);color:var(--bad)}.rp.acc{background:var(--accent-soft);color:var(--accent)}.rp.neu{background:var(--panel2);color:var(--muted)}.rp.none{color:#4a5368}
.cwl td.cell{text-align:center}
.cwl th.tot,.cwl td.tot{padding-left:10px;padding-right:12px;width:1%}
.curcol{background:var(--accent-soft) !important}
select.chip,.chipx{appearance:none;-webkit-appearance:none;width:42px;height:28px;padding:0;text-align:center;text-align-last:center;border-radius:8px;font-weight:700;font-size:13.5px;background:#141a26;border:1px solid var(--line);color:#4f5870;font-style:normal;display:inline-flex;align-items:center;justify-content:center;line-height:1}
select.chip:hover:not(:disabled){border-color:#4a5672}
.chip.vw,.chipx.vw{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.chip.v0,.chip.v1{color:var(--ink)}
.chip.v2,.chipx.v2{background:rgba(242,181,58,.13);border-color:rgba(242,181,58,.35);color:var(--gold)}
.chip.v3,.chipx.v3{background:rgba(76,194,122,.16);border-color:rgba(76,194,122,.45);color:var(--ok)}
.chip.vx,.chipx.vx{background:rgba(236,90,85,.16);border-color:rgba(236,90,85,.45);color:var(--bad)}
.chipx{width:32px;height:22px;font-size:12px;margin-right:3px}
.cwl tr.bonus td.pl{box-shadow:inset 3px 0 0 var(--gold)}
.bonusmark{font-style:normal;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted);margin:2px 0 10px}
.legend > span{display:inline-flex;align-items:center}
.sortsel{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.sortsel select{padding:4px 8px}
.waitbox{margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
details.card summary{cursor:pointer;font-weight:600}
.rounds-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;margin-top:12px}
.rounds-edit .row{align-items:center;flex-wrap:nowrap}
body.public select:disabled,body.public input:disabled{opacity:1;cursor:default}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:100;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h3{margin-bottom:14px;font-size:21px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:50vh;overflow:auto;padding:4px}
.calrow{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.calrow:last-child{border-bottom:0}
.calrow .ev{font-weight:700}
.thdist{display:flex;flex-direction:column;gap:6px}
.thdist .r{display:grid;grid-template-columns:50px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.todo{display:flex;align-items:center;gap:8px;padding:6px 0}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo span{flex:1}
pre.msg{white-space:pre-wrap}
.kbd{font-family:var(--cond);background:#141a26;border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media (prefers-reduced-motion:no-preference){
  main > *{animation:rise .28s ease both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 35 8v11c0 9.5-6.2 16.3-15 19-8.8-2.7-15-9.5-15-19V8z" fill="var(--panel2)" stroke="var(--accent)" stroke-width="2"/><path d="M13 27 27 13M27 27 13 13" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="20" r="3.2" fill="var(--accent)"/></svg>
      <div><h1 id="clanTitle">Panel klanu</h1><small id="clanSub">Clash of Clans · sztab</small></div>
    </div>
    <div class="switch" role="group" aria-label="Wybór klanu">
      <button type="button" data-act="clan" data-id="main" id="sw-main"><span class="dot" style="background:var(--gold)"></span><span id="sw-main-l">Główny</span></button>
      <button type="button" data-act="clan" data-id="academy" id="sw-academy"><span class="dot" style="background:var(--elixir)"></span><span id="sw-academy-l">Akademia</span></button>
    </div>
    <div class="sync" id="sync"><i></i><span>Wczytywanie…</span></div>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"><div class="loading">Wczytywanie danych klanu…</div></main>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
const PUBLIC=(document.querySelector('meta[name="panel-mode"]')||{}).content==='public';
/* =========================================================
   Stałe gry
   ========================================================= */
const HEROES=[
  ['bk','BK','Barbarian King (Król Barbarzyńców)',7],
  ['aq','AQ','Archer Queen (Królowa Łuczniczek)',8],
  ['mp','MP','Minion Prince',9],
  ['gw','GW','Grand Warden (Wielki Strażnik)',11],
  ['rc','RC','Royal Champion (Królewska Czempionka)',13],
  ['dd','DD','Dragon Duke',15]
];
const ROLES={leader:'Przywódca',coleader:'Współprzywódca',elder:'Starszy',member:'Członek'};

function warCalc(w){
  const best={};let used=0,total=0;
  w.lineup.forEach(id=>{if(!id)return;total+=(w.apm||2);(w.att[id]||[]).forEach(a=>{if(a&&a.s!=null){used++;if(a.t){const b=best[a.t];if(!b||a.s>b.s||(a.s===b.s&&(a.d||0)>(b.d||0)))best[a.t]={s:a.s,d:a.d||0,by:id}}}})});
  let stars=0,pct=0;Object.values(best).forEach(b=>{stars+=b.s;pct+=b.d});
  return {best,stars,pct:w.size?pct/w.size:0,used,total};
}
function warResult(ours,oursPct,theirs,theirsPct){if(ours>theirs)return 'W';if(ours<theirs)return 'L';if(oursPct>theirsPct)return 'W';if(oursPct<theirsPct)return 'L';return 'D'}
function archiveWar(c,clanId,w,demo){
  const k=warCalc(w);
  const rows=w.lineup.map((id,i)=>{if(!id)return null;const m=mById(c,id);return {m:id,name:m?m.name:'?',th:m?m.th:0,pos:i+1,a:(w.att[id]||[{},{}]).map(a=>({t:a&&a.t||null,s:a&&a.s!=null?a.s:null,d:a&&a.d!=null?a.d:null}))}}).filter(Boolean);
  const es=Number(w.enemyStars)||0,ep=Number(w.enemyPct)||0;
  return {id:w.id||uid(),clan:clanId,enemy:w.enemy||'Przeciwnik',enemyTag:w.enemyTag||'',size:w.size,date:(w.end||new Date().toISOString()).slice(0,10),
    ourStars:k.stars,ourPct:Math.round(k.pct*10)/10,enemyStars:es,enemyPct:ep,result:warResult(k.stars,k.pct,es,ep),rows,demo:!!demo};
}

function memberStats(c,hist){

  hist.forEach(w=>w.rows.forEach(r=>{
    const st=map[r.m]||(map[r.m]={id:r.m,name:r.name,th:r.th,wars:0,used:0,avail:0,missed:0,stars:0,three:0,pct:0});
    st.wars++;st.name=r.name;st.th=Math.max(st.th,r.th);
    r.a.forEach(a=>{st.avail++;if(a.s!=null){st.used++;st.stars+=a.s;if(a.s===3)st.three++;st.pct+=a.d||0}else st.missed++});
  }));
  Object.values(map).forEach(s=>{const m=mById(c,s.id);if(m){s.name=m.name;s.th=m.th;s.inClan=m.status!=='left'}s.avg=s.used?s.stars/s.used:0;s.rate3=s.used?s.three/s.used:0;s.avgPct=s.used?s.pct/s.used:0});
  return map;
}

function raidInfo(now=new Date()){
  let start=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),7));
  start.setUTCDate(start.getUTCDate()-((now.getUTCDay()-5+7)%7));
  if(start>now)start.setUTCDate(start.getUTCDate()-7);
  const end=new Date(start.getTime()+3*864e5);
  if(now<end)return {active:true,start,end};
  const ns=new Date(start.getTime()+7*864e5);return {active:false,start:ns,end:new Date(ns.getTime()+3*864e5)};
}
function monthWindow(now,d1,d2,h){
  const y=now.getUTCFullYear(),m=now.getUTCMonth();
  let s=new Date(Date.UTC(y,m,d1,h)),e=new Date(Date.UTC(y,m,d2,h));
  if(now>=e){s=new Date(Date.UTC(y,m+1,d1,h));e=new Date(Date.UTC(y,m+1,d2,h))}
  return {active:now>=s&&now<e,start:s,end:e};
}

function syncIdle(){
  if(PUBLIC)return setSync(S.sync?'ok':'busy',S.sync?'Dane z gry · odświeżane co ~30 min':'Wczytywanie danych z gry…');
  if(S.demo)return setSync('demo','Przykład · nic nie jest zapisywane');
  if(S.readOnly)return setSync('neu','Tylko podgląd');
  if(S.mode==='db')return setSync('ok','Zapisano · wspólne dla współprzywódców');
  if(S.mode==='local')return setSync('ok','Zapisano w tej przeglądarce');
}
function commit(clanId=S.cur){
  render();
  if(S.demo||S.readOnly)return;
  dirty[clanId]=true;setSync('busy','Zapisywanie…');
  clearTimeout(timers[clanId]);timers[clanId]=setTimeout(()=>flush(clanId),600);
}
async function flush(id){
  if(saving[id]){again[id]=true;return}
  saving[id]=true;dirty[id]=false;
  try{
    if(S.mode==='db')await S.db.doc('clans/'+id).set(clone(S.clans[id]));
    else saveLocal();
    if(!dirty[id])syncIdle();
  }catch(e){handleWriteErr(e)}
  saving[id]=false;
  if(again[id]||dirty[id]){again[id]=false;flush(id)}
}
function handleWriteErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'&&!S.readOnly){S.readOnly=true;toast('Nie masz uprawnień do zapisu – panel w trybie podglądu');render();syncIdle();return}
  if(code==='quota_exceeded'){setSync('err','Baza pełna – usuń stare wojny w Historii');return}
  setSync('err','Błąd zapisu – spróbuj ponownie');console.warn(e);
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.clans));localStorage.setItem(LS_HIST,JSON.stringify(S.history))}catch(e){}}
async function putHistory(h){
  S.history=S.history.filter(x=>x.id!==h.id).concat([h]);
  if(S.demo||S.readOnly)return;
  if(S.mode==='db'){try{await S.db.collection('history').doc(h.id).set(clone(h))}catch(e){handleWriteErr(e)}}else saveLocal();
}
async function delHistory(id){
  S.history=S.history.filter(x=>x.id!==id);
  if(S.demo||S.readOnly)return;
  if(S.mode==='db'){try{await S.db.collection('history').doc(id).delete()}catch(e){handleWriteErr(e)}}else saveLocal();
}

async function boot(){
  try{const u=JSON.parse(localStorage.getItem(LS_UI)||'{}');if(u.cur)S.cur=u.cur}catch(e){}
  readHash();
  if(PUBLIC){document.body.classList.add('public');S.mode='public';S.readOnly=true;S.clans={main:defaultClan('main'),academy:defaultClan('academy')};S.ready=true;syncIdle();render();fetchSync();setInterval(fetchSync,5*60000);return}
  render();fetchSync();setInterval(fetchSync,10*60000);
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){startLocal();return}
  S.db=db;S.mode='db';
  try{const u=await window.claude.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false)S.readOnly=true}}catch(e){}
  const got={main:false,academy:false},real={main:null,academy:null};let histGot=false;let settled=false;
  const timeout=setTimeout(()=>{if(!settled){settled=true;S.mode='local';S.db=null;startLocal('Brak połączenia z bazą – pracujesz na kopii w tej przeglądarce')}},10000);
  const maybeReady=()=>{
    if(settled||!got.main||!got.academy||!histGot)return;
    settled=true;clearTimeout(timeout);S.ready=true;
    if(!S.clans.main&&!S.clans.academy){loadDemo()}
    else{S.clans.main=normalize(S.clans.main,'main');S.clans.academy=normalize(S.clans.academy,'academy');S.demo=false}
    syncIdle();render();trySync();
  };
  ['main','academy'].forEach(id=>{
    db.doc('clans/'+id).onSnapshot(snap=>{
      if(dirty[id]||saving[id]||snap.metadata.hasPendingWrites)return;
      if(settled&&S.demo&&!snap.exists)return;
      if(snap.exists){
        if(settled&&S.demo){S.demo=false;S.history=[];S.clans[other(id)]=real[other(id)]||defaultClan(other(id))}
        S.clans[id]=normalize(snap.data(),id);real[id]=S.clans[id];
      }else if(!settled)S.clans[id]=null;
      if(!snap.metadata.fromCache)got[id]=true;
      if(settled){syncIdle();render()}else maybeReady();
    },err=>{if(!settled){settled=true;clearTimeout(timeout);S.mode='local';S.db=null;startLocal('Baza niedostępna – pracujesz na kopii w tej przeglądarce')}});
  });
  db.collection('history').orderBy('date','desc').limit(1000).onSnapshot(snap=>{
    if(!(settled&&S.demo))S.history=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!snap.metadata.fromCache)histGot=true;
    if(settled)render();else maybeReady();
  },err=>{histGot=true;maybeReady()});
}
function startLocal(note){
  S.mode='local';
  let saved=null,hist=[];
  try{saved=JSON.parse(localStorage.getItem(LS_KEY)||'null');hist=JSON.parse(localStorage.getItem(LS_HIST)||'[]')}catch(e){}
  if(saved&&(saved.main||saved.academy)){S.clans.main=normalize(saved.main,'main');S.clans.academy=normalize(saved.academy,'academy');S.history=hist||[];S.demo=false}
  else loadDemo();
  S.ready=true;syncIdle();render();trySync();if(note)toast(note);
}
function loadDemo(){const d=demoData();S.clans.main=d.main;S.clans.academy=d.academy;S.history=d.history;S.demo=true}
async function startFresh(keepNames){
  const n={main:defaultClan('main'),academy:defaultClan('academy')};
  S.clans=n;S.history=[];S.demo=false;
  syncIdle();render();
  if(S.readOnly)return;
  if(S.mode==='db'){try{await S.db.doc('clans/main').set(clone(n.main));await S.db.doc('clans/academy').set(clone(n.academy))}catch(e){handleWriteErr(e)}}
  else saveLocal();
  location.hash='ustawienia';
}


/* =========================================================
   Synchronizacja z grą (plik sync.json z GitHub Actions)
   ========================================================= */
function normTag(t){return '#'+String(t||'').toUpperCase().replace(/^#/,'').replace(/O/g,'0')}
async function fetchSync(){
  // Publiczna strona działa na dowolnym hostingu: najpierw plik obok strony (GitHub Pages), potem prosto z repozytorium.
  const urls=PUBLIC?['sync.json','https://raw.githubusercontent.com/xSmokee67/coc-sync/main/sync.json']:['sync.json'];
  try{let j=null;for(const u of urls){try{const r=await fetch(u+'?'+Date.now(),{cache:'no-store'});if(r.ok){j=await r.json();break}}catch(e){}}
    if(!j||!j.clans||!j.generatedAt)return;
    if(S.sync&&S.sync.generatedAt===j.generatedAt)return;
    S.sync=j;trySync();render()}catch(e){}
}
function trySync(){
  const sy=S.sync;if(!sy||!sy.clans||!S.ready||(S.readOnly&&!PUBLIC))return;
  const ok=id=>sy.clans[id]&&sy.clans[id].ok;
  if(!ok('main')&&!ok('academy'))return;
  if(S.demo){S.demo=false;S.history=[];S.clans={main:defaultClan('main'),academy:defaultClan('academy')}}
  ['main','academy'].forEach(id=>{
    const c=S.clans[id];if(!c||!ok(id))return;
    if((c.syncedAt||'')>=sy.generatedAt)return;
    try{applySyncClan(id,c,sy.clans[id],sy.generatedAt)}catch(e){console.warn('sync',e);return}
    if(PUBLIC){syncIdle();render()}else commit(id);
  });
}
function applySyncClan(id,c,sc,gen){
  const st=c.settings;
  if(sc.clan){if(sc.clan.name)st.name=sc.clan.name;if(sc.clan.tag)st.tag=sc.clan.tag}
  const byTag={};c.members.forEach(m=>{if(m.tag)byTag[normTag(m.tag)]=m});
  const newMember=(p,status)=>{const m={id:uid(),name:p.name||'?',tag:p.tag,th:p.th||1,role:'member',heroes:{},warPref:'in',don:0,rec:0,joined:todayISO(),lastSeen:'',notes:'',status};c.members.push(m);byTag[normTag(p.tag)]=m;return m};
  const ensure=p=>byTag[normTag(p.tag)]||newMember(p,'left');
  // członkowie
  const seen=new Set();
  (sc.members||[]).forEach(p=>{
    const t=normTag(p.tag);seen.add(t);const m=byTag[t]||newMember(p,'active');
    m.name=p.name||m.name;m.tag=p.tag;m.role=p.role||m.role;m.status='active';
    if(p.th)m.th=p.th;if(p.heroes)m.heroes=Object.assign({},m.heroes,p.heroes);if(p.warPref)m.warPref=p.warPref;
    m.don=p.don||0;m.rec=p.rec||0;if(p.lastActive)m.lastSeen=p.lastActive.slice(0,10);
  });
  if((sc.members||[]).length)c.members.forEach(m=>{if(m.tag&&m.status!=='left'&&!seen.has(normTag(m.tag)))m.status='left'});
  // wojna
  const toLocal=(w,prev)=>{
    const lineup=Array(w.size).fill(null),att={};
    w.ours.forEach(o=>{const m=ensure(o);lineup[o.pos-1]=m.id;const pa=prev&&prev.att[m.id]||[];const a=[];
      for(let j=0;j<(w.apm||1);j++){const x=o.attacks[j];
        a.push(x?{t:x.t,s:x.s,d:x.d}:{t:pa[j]&&pa[j].s==null?pa[j].t:(prev?null:(j===0?o.pos:null)),s:null,d:null})}
      att[m.id]=a});
    return {id:'api-'+w.id,api:true,state:w.state,enemy:w.enemy,enemyTag:w.enemyTag,size:w.size,apm:w.apm,type:'normal',start:w.start,end:w.end,
      lineup,enemyTH:w.enemyTH||[],enemyNote:prev?prev.enemyNote||[]:[],att,enemyStars:w.enemyStars||0,enemyPct:w.enemyPct||0};
  };
  const archive=w=>{if(!S.history.some(h=>h.id===w.id)){const h=archiveWar(c,id,w,false);h.id=w.id;putHistory(h)}};
  const w=sc.war;
  if(w&&w.ours&&(w.state==='preparation'||w.state==='inWar')){
    const wid='api-'+w.id;const prev=c.war&&c.war.id===wid?c.war:null;
    if(c.war&&c.war.api&&c.war.id!==wid)archive(c.war);
    c.war=toLocal(w,prev);
  }else if(w&&w.ours&&w.state==='warEnded'){
    const wid='api-'+w.id;const prev=c.war&&c.war.id===wid?c.war:null;
    archive(toLocal(w,prev));
    if(c.war&&c.war.api)c.war=null;
  }else if(w&&w.state==='notInWar'){
    if(c.war&&c.war.api){archive(c.war);c.war=null}
  }
  // CWL
  if(sc.cwl&&Array.isArray(sc.cwl.rounds)){
    const cw=c.cwl;const ss=String(sc.cwl.season||'').slice(0,7);
    if(cw.season!==ss){
      if(cw.rounds.some(r=>Object.keys(r.cells).length)){const rank=cwlRank(c).filter(x=>x.miss===0).slice(0,Number(cw.bonuses)||0);
        c.cwlArchive.push({season:cw.season,league:cw.league,w:cw.rounds.filter(r=>r.result==='W').length,l:cw.rounds.filter(r=>r.result==='L').length,bonus:rank.map(x=>mName(c,x.id)),totals:cwlTotals(c).map(x=>({id:x.id,name:mName(c,x.id),s:x.stars,a:x.att,m:x.miss}))})}
      const n=newCwl();n.size=cw.size;n.bonuses=cw.bonuses;n.league=cw.league;n.season=ss;c.cwl=n;
    }
    if(sc.cwl.size)c.cwl.size=sc.cwl.size;
    if(sc.clan&&sc.clan.warLeague&&!c.cwl.league)c.cwl.league=sc.clan.warLeague;
    sc.cwl.rounds.forEach((r,i)=>{if(!r||i>6)return;const R=c.cwl.rounds[i];R.enemy=r.enemy||R.enemy;R.result=r.result||'';R.cells={};
      r.lineup.forEach(x=>{const m=ensure(x);R.cells[m.id]=x.s!=null?String(x.s):(r.state==='warEnded'?'x':'w');if(!c.cwl.pool.includes(m.id))c.cwl.pool.push(m.id)})});
  }
  // Raid Weekend
  if(sc.raid){c.raid={week:(sc.raid.start||'').slice(0,10)||todayISO(),att:{},gold:{}};if(sc.raid.limit)st.raidAttacks=sc.raid.limit;
    sc.raid.members.forEach(x=>{const m=byTag[normTag(x.tag)];if(m){c.raid.att[m.id]=x.attacks;c.raid.gold[m.id]=x.gold}})}
  // Igrzyska
  if(sc.cg){if(c.games.season!==sc.cg.season)c.games={season:sc.cg.season,pts:{}};
    Object.entries(sc.cg.pts||{}).forEach(([t,v])=>{const m=byTag[normTag(t)];if(m)c.games.pts[m.id]=v})}
  // archiwum wojen z GitHuba (uzupełnia historię, gdy panel nie złapał końca wojny)
  (sc.history||[]).forEach(h=>{if(!h||!h.id||S.history.some(x=>x.id===h.id))return;
    const hh=Object.assign({},h,{clan:id,rows:(h.rows||[]).map(r=>({m:ensure(r).id,name:r.name,th:r.th,pos:r.pos,a:r.a||[]}))});
    if(PUBLIC)S.history.push(hh);else putHistory(hh)});
  c.syncedAt=gen;
}
function syncNote(id){
  const sy=S.sync;if(!sy)return '';const sc=sy.clans&&sy.clans[id];if(!sc)return '';
  if(!sc.ok)return `<span class="pill bad">Synchronizacja: ${esc(sc.error||'błąd')}</span>`;
  const age=Date.now()-new Date(sy.generatedAt).getTime();
  const warn=[sc.warError,sc.cwlError,sc.raidError].filter(Boolean);
  return `<span class="pill ${age>3*36e5?'warn':'ok'}">● Dane z gry: ${fmtDT(sy.generatedAt)}</span>${warn.map(x=>` <span class="pill warn">${esc(x)}</span>`).join('')}`;
}

  if(S.cur==='academy'){const cand=promoCandidates(c);if(cand.length)att.push(['acc',`Kandydaci do awansu do ${esc(S.clans.main.settings.name)}: ${esc(cand.map(s=>s.name).join(', '))}`,'historia'])}

  ].sort((a,b)=>(b[1].active-a[1].active)||(a[1].start-b[1].start));
  const wl=hist.slice(0,10);const wins=wl.filter(h=>h.result==='W').length;

  </div>`;
}
function autoLineup(c,size){
  const hs=m=>HEROES.reduce((a,[k])=>a+(Number(m.heroes[k])||0),0);
  const l=members(c).filter(m=>m.warPref==='in').sort((a,b)=>b.th-a.th||hs(b)-hs(a)).slice(0,size).map(m=>m.id);
  while(l.length<size)l.push(null);return l;
}

function vHistory(c){
  const all=histFor(S.cur);const hist=UI.hRange?all.slice(0,UI.hRange):all;
  const st=Object.values(memberStats(c,hist));
  const keys={name:(a,b)=>a.name.localeCompare(b.name,'pl'),stars:(a,b)=>b.stars-a.stars,avg:(a,b)=>b.avg-a.avg,rate3:(a,b)=>b.rate3-a.rate3,missed:(a,b)=>b.missed-a.missed,wars:(a,b)=>b.wars-a.wars,pct:(a,b)=>b.avgPct-a.avgPct};
  st.sort(keys[UI.hSort]||keys.stars);
  const sh=(k,l,cls='n')=>`<th class="sortable ${cls}" data-act="hsort" data-k="${k}">${l}${UI.hSort===k?' ▾':''}</th>`;
  const cand=S.cur==='academy'?promoCandidates(c):[];

  return `

    <div class="actions"><select id="h-range" data-ch="hrange" data-ro-ok>${[[5,'Ostatnie 5 wojen'],[10,'Ostatnie 10 wojen'],[20,'Ostatnie 20 wojen'],[0,'Wszystkie']].map(([v,l])=>`<option value="${v}" ${UI.hRange===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
  ${cand.length?`<div class="card" style="margin-bottom:14px"><h3>Kandydaci do awansu do ${esc(S.clans.main.settings.name)}</h3><p class="small muted" style="margin:0 0 8px">Min. 3 wojny w ostatnich 6, zero nieużytych ataków, średnio 2,3★ lub więcej.</p><div class="row">${cand.map(s=>`<span class="pill acc">${esc(s.name)} · TH${s.th} · ${s.avg.toFixed(2).replace('.',',')}★</span>`).join('')}</div></div>`:''}
  <div class="grid" style="align-items:start">
    <div><h3 style="margin-bottom:10px">Wyniki graczy</h3>
    ${st.length?`<div class="tablewrap"><table><thead><tr>${sh('name','Gracz','')}<th>TH</th>${sh('wars','Wojny')}${sh('stars','★')}${sh('avg','Śr. ★')}${sh('rate3','3★ %')}${sh('pct','Śr. %')}${sh('missed','Nieuż.')}</tr></thead><tbody>
      ${st.map(s=>`<tr><td><span class="name">${esc(s.name)}</span>${s.inClan?'':' <span class="pill neu">poza klanem</span>'}</td><td>${thBadge(s.th)}</td><td class="n">${s.wars}</td><td class="n">${s.stars}</td><td class="n"><b>${s.avg.toFixed(2).replace('.',',')}</b></td><td class="n">${Math.round(s.rate3*100)}%</td><td class="n">${Math.round(s.avgPct)}%</td><td class="n">${s.missed?`<span class="pill ${s.missed>1?'bad':'warn'}">${s.missed}</span>`:'<span class="muted">0</span>'}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="card empty">Statystyki pojawią się po zakończeniu pierwszej wojny.</div>'}</div>
    <div><h3 style="margin-bottom:10px">Wojny</h3>
    ${all.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Przeciwnik</th><th class="c">Wynik</th><th class="n">★</th><th class="n">%</th><th class="c">Nieuż.</th><th></th></tr></thead><tbody>
      ${all.map(h=>{const miss=h.rows.reduce((a,r)=>a+r.a.filter(x=>x.s==null).length,0);return `<tr><td>${fmtDate(h.date)}</td><td><span class="name">${esc(h.enemy)}</span><span class="tag">${h.size}v${h.size}</span></td><td class="c"><span class="pill ${h.result==='W'?'ok':h.result==='L'?'bad':'neu'}">${h.result==='W'?'Wygrana':h.result==='L'?'Przegrana':'Remis'}</span></td><td class="n">${h.ourStars}:${h.enemyStars}</td><td class="n">${String(h.ourPct).replace('.',',')}</td><td class="c">${miss||'<span class="muted">0</span>'}</td><td><button class="iconbtn" data-act="hdel" data-id="${h.id}" aria-label="Usuń wojnę">✕</button></td></tr>`}).join('')}
    </tbody></table></div>`:'<div class="card empty">Brak zakończonych wojen.</div>'}</div>
  </div>`;
}

/* ---------- CWL ---------- */
const CWL_VALS=[['','·'],['w','●'],['0','0★'],['1','1★'],['2','2★'],['3','3★'],['x','✗']];
function cwlTotals(c){
  const t={};
  c.cwl.pool.forEach(id=>t[id]={id,stars:0,att:0,miss:0,rounds:0});
  c.cwl.rounds.forEach(r=>Object.entries(r.cells).forEach(([id,v])=>{if(!v)return;const x=t[id]||(t[id]={id,stars:0,att:0,miss:0,rounds:0});x.rounds++;if(v==='x')x.miss++;else if(v!=='w'){x.att++;x.stars+=Number(v)}}));
  return Object.values(t);
}
function cwlRank(c){return cwlTotals(c).filter(x=>x.rounds>0).sort((a,b)=>(b.stars-b.miss*2)-(a.stars-a.miss*2)||b.att-a.att)}
function cwlRoundStates(cw){
  // pierwsza nierozstrzygnięta runda ze składem = trwa, kolejna = przygotowania
  let cur=-1,prep=-1;
  cw.rounds.forEach((r,i)=>{const has=Object.values(r.cells).some(Boolean);if(has&&!r.result){if(cur<0)cur=i;else if(prep<0)prep=i}});
  return {cur,prep};
}
function vCwl(c){
  const cw=c.cwl;const tot={};cwlTotals(c).forEach(x=>tot[x.id]=x);
  const rank=cwlRank(c);const bonusIds=new Set(rank.slice(0,Number(cw.bonuses)||0).filter(x=>x.miss===0).map(x=>x.id));
  const rankPos={};rank.forEach((x,i)=>rankPos[x.id]=i+1);
  let pool=cw.pool.map(id=>mById(c,id)).filter(Boolean);
  if(UI.cwlSort==='stars')pool.sort((a,b)=>(rankPos[a.id]||999)-(rankPos[b.id]||999));else pool.sort((a,b)=>b.th-a.th||a.name.localeCompare(b.name,'pl'));
  const cnt=r=>Object.values(r.cells).filter(Boolean).length;
  const rw=cw.rounds.filter(r=>r.result==='W').length,rl=cw.rounds.filter(r=>r.result==='L').length,rd=cw.rounds.filter(r=>r.result==='D').length;
  const info=cwlInfo();const {cur,prep}=cwlRoundStates(cw);
  const allT=Object.values(tot);const sumStars=allT.reduce((a,x)=>a+x.stars,0),sumMiss=allT.reduce((a,x)=>a+x.miss,0),sumAtt=allT.reduce((a,x)=>a+x.att,0);
  const waiting=cur>=0?Object.entries(cw.rounds[cur].cells).filter(([,v])=>v==='w').map(([id])=>mName(c,id)):[];
  const resPill=(r,i)=>r.result==='W'?'<span class="rp ok">W</span>':r.result==='L'?'<span class="rp bad">L</span>':r.result==='D'?'<span class="rp neu">R</span>':i===cur?'<span class="rp acc">trwa</span>':i===prep?'<span class="rp neu">przyg.</span>':'<span class="rp none">–</span>';
  const ro=PUBLIC||S.readOnly;
  return `
  <div class="pagehead"><div><h2>Liga Klanów (CWL)</h2><p>Sezon ${esc(cw.season)}${cw.league?' · '+esc(cw.league):''} · ${cw.size} vs ${cw.size} · ${info.active?'koniec ok. '+fmtDT(info.end):'następny start '+fmtDT(info.start)}</p></div>
    <div class="actions"><button class="btn" data-act="cwlpool">Pula graczy (${cw.pool.length})</button><a class="btn" href="#ogloszenia" data-act="tplgo" data-tpl="cwlround">Skład na czat</a><button class="btn" data-act="cwlclose">Nowy sezon</button></div></div>
  <div class="tiles">
    <div class="tile"><div class="k">Bilans rund</div><div class="v">${rw}<small> W · ${rl} L${rd?' · '+rd+' R':''}</small></div><div class="s">${cw.rounds.map((r,i)=>r.result==='W'?'🟩':r.result==='L'?'🟥':r.result==='D'?'⬜':i===cur?'🟨':'▫️').join('')}</div></div>
    <div class="tile"><div class="k">Gwiazdki w sezonie</div><div class="v">${sumStars}<small> ★</small></div><div class="s">${sumAtt} ataków · śr. ${sumAtt?(sumStars/sumAtt).toFixed(2).replace('.',','):'0'}★</div></div>
    <div class="tile"><div class="k">Nieużyte ataki</div><div class="v" style="color:${sumMiss?'var(--bad)':'inherit'}">${sumMiss}</div><div class="s">${sumMiss?'każdy to strata gwiazdek i bonusu':'nikt nie zawalił'}</div></div>
    <div class="tile ${waiting.length?'hot':''}"><div class="k">${cur>=0?'Runda '+(cur+1)+(cw.rounds[cur].enemy?' vs '+esc(cw.rounds[cur].enemy):''):'Bieżąca runda'}</div><div class="v">${cur>=0?waiting.length+'<small> do ataku</small>':'–'}</div><div class="s">${cur>=0?(waiting.length?'zobacz listę poniżej':'wszyscy zaatakowali ✓'):'brak trwającej rundy'}</div></div>
  </div>
  ${waiting.length?`<div class="card waitbox"><b>Jeszcze nie zaatakowali w rundzie ${cur+1}:</b> ${waiting.map(n=>`<span class="pill acc">${esc(n)}</span>`).join(' ')}</div>`:''}
  <div class="legend">
    <span><i class="chipx v">·</i> poza składem</span><span><i class="chipx vw">●</i> w składzie, czeka na atak</span><span><i class="chipx v2">2★</i><i class="chipx v3">3★</i> wynik ataku</span><span><i class="chipx vx">✗</i> nieużyty atak</span><span><i class="bonusmark">🎖</i> proponowany bonus</span>
    <label class="sortsel" data-ro-ok>Kolejność <select id="cwl-sort" data-ch="cwlsort" data-ro-ok><option value="th" ${UI.cwlSort!=='stars'?'selected':''}>wg ratusza</option><option value="stars" ${UI.cwlSort==='stars'?'selected':''}>wg wyników</option></select></label>
  </div>
  ${pool.length?`<div class="tablewrap cwl"><table>
    <thead><tr><th class="pl">Gracz</th>${cw.rounds.map((r,i)=>`<th class="rnd ${i===cur?'curcol':''}"><div class="rn">R${i+1}</div>${resPill(r,i)}<div class="ren" title="${esc(r.enemy||'')}">${r.enemy?esc(r.enemy):(cnt(r)?cnt(r)+'/'+cw.size:'&nbsp;')}</div></th>`).join('')}<th class="n tot">★</th><th class="n tot">Ataki</th><th class="n tot">Nieuż.</th></tr></thead>
    <tbody>
    ${pool.map(m=>{const t=tot[m.id]||{stars:0,att:0,miss:0};const bon=bonusIds.has(m.id);
      return `<tr class="${bon?'bonus':''}"><td class="pl"><div class="pln"><span class="name" title="${esc(m.name)}">${esc(m.name)}</span>${bon?'<i class="bonusmark" title="Proponowany bonus">🎖</i>':''}</div><span class="th sm t${m.th}">TH${m.th}</span>${UI.cwlSort==='stars'&&rankPos[m.id]?`<span class="rk">#${rankPos[m.id]}</span>`:''}</td>
      ${cw.rounds.map((r,i)=>{const v=r.cells[m.id]||'';return `<td class="cell ${i===cur?'curcol':''}"><select id="cwl-${i}-${m.id}" class="chip v${v}" data-ch="cwlcell" data-i="${i}" data-id="${m.id}" aria-label="${esc(m.name)}, runda ${i+1}">${CWL_VALS.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select></td>`}).join('')}
      <td class="n tot"><b>${t.stars}</b></td><td class="n tot">${t.att}</td><td class="n tot">${t.miss?`<span class="pill bad">${t.miss}</span>`:'<span class="muted">0</span>'}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin-top:8px">Bonus: ${Number(cw.bonuses)||0} najlepszych wg gwiazdek, bez nieużytych ataków (każdy nieużyty = –2 w rankingu). ${PUBLIC?'':'Wyniki z gry wpisują się same – kratkę możesz też zmienić ręcznie, klikając ją.'}</p>`
  :`<div class="card empty">${PUBLIC?'Klan nie gra teraz w Lidze Klanów.':'Wybierz pulę graczy na ten sezon – przycisk „Pula graczy”.'}</div>`}
  ${PUBLIC?'':`<details class="card" style="margin-top:14px"><summary>Ustawienia sezonu i ręczna edycja rund</summary>
    <div class="row" style="margin-top:12px">
      <label class="f">Sezon<input type="text" id="cwl-season" data-ch="cwlset" data-f="season" value="${esc(cw.season)}"></label>
      <label class="f">Rozmiar<select id="cwl-size" data-ch="cwlset" data-f="size">${[15,30].map(s=>`<option value="${s}" ${Number(cw.size)===s?'selected':''}>${s} vs ${s}</option>`).join('')}</select></label>
      <label class="f">Liga<input type="text" id="cwl-league" data-ch="cwlset" data-f="league" value="${esc(cw.league)}" placeholder="np. Kryształowa I"></label>
      <label class="f">Liczba bonusów<input type="number" min="0" max="20" id="cwl-bon" data-ch="cwlset" data-f="bonuses" value="${cw.bonuses}"></label>
    </div>
    <div class="rounds-edit">${cw.rounds.map((r,i)=>`<div class="row"><b style="width:30px">R${i+1}</b><input type="text" id="cwl-en-${i}" data-ch="cwlround" data-i="${i}" data-f="enemy" value="${esc(r.enemy)}" placeholder="przeciwnik" style="flex:1"><select id="cwl-res-${i}" data-ch="cwlround" data-i="${i}" data-f="result">${[['','w toku / brak'],['W','Wygrana'],['L','Przegrana'],['D','Remis']].map(([v,l])=>`<option value="${v}" ${r.result===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div>
  </details>`}
  ${c.cwlArchive.length?`<div class="card" style="margin-top:14px"><h3>Poprzednie sezony</h3><div class="list">${c.cwlArchive.slice().reverse().map(a=>`<div><b>${esc(a.season)}</b><span class="muted">${esc(a.league||'')}</span><span>${a.w}–${a.l}</span><span class="small muted" style="margin-left:auto">Bonusy: ${esc((a.bonus||[]).join(', ')||'–')}</span></div>`).join('')}</div></div>`:''}`;
}

/* ---------- Ostrzeżenia ---------- */
function vStrikes(c){
  const st=c.settings;const ms=members(c);
  const sum=ms.map(m=>({m,p:strikePts(c,m.id)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p);
  const lim=Date.now()-st.strikeDays*864e5;
  const log=c.strikes.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="pagehead"><div><h2>Ostrzeżenia</h2><p>Limit: ${st.strikeLimit} pkt · ostrzeżenie wygasa po ${st.strikeDays} dniach (zmienisz w ustawieniach).</p></div></div>
  <div class="card" style="margin-bottom:14px"><h3>Dodaj ostrzeżenie</h3>
    <form class="row" data-form="strike">
      <label class="f">Gracz<select name="member" required><option value="">— wybierz —</option>${ms.slice().sort((a,b)=>a.name.localeCompare(b.name,'pl')).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>
      <label class="f">Powód<select name="reason">${STRIKE_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></label>
      <label class="f" style="flex:0 1 90px">Punkty<input type="number" name="pts" min="1" max="5" value="1"></label>
      <label class="f" style="flex:0 1 150px">Data<input type="date" name="date" value="${todayISO()}"></label>
      <label class="f" style="flex:2 1 200px">Notatka<input type="text" name="note" placeholder="opcjonalnie"></label>
      <button class="btn pri" type="submit">Dodaj</button>
    </form></div>
  <div class="grid g2" style="align-items:start">
    <div class="card"><h3>Aktywne<span class="sub">${sum.length} graczy</span></h3>
      ${sum.length?`<div class="list">${sum.map(({m,p})=>`<div><span class="sev ${p>=st.strikeLimit?'bad':p===st.strikeLimit-1?'warn':'neu'}"></span><span style="flex:1"><b>${esc(m.name)}</b> ${thBadge(m.th)}<div class="small muted">${esc(activeStrikes(c,m.id).map(s=>s.reason).join(' · '))}</div></span><span class="pill ${p>=st.strikeLimit?'bad':'warn'}">${p}/${st.strikeLimit}</span>${p>=st.strikeLimit?`<button class="btn sm" data-act="medit" data-id="${m.id}">Profil</button>`:''}</div>`).join('')}</div>`:'<div class="empty">Nikt nie ma aktywnych ostrzeżeń.</div>'}
    </div>
    <div class="card"><h3>Dziennik<span class="sub">${log.length} wpisów</span></h3>
      ${log.length?`<div class="list">${log.map(s=>{const exp=new Date(s.date).getTime()<lim;return `<div style="${exp?'opacity:.5':''}"><span style="width:62px" class="small muted">${fmtDate(s.date)}</span><span style="flex:1"><b>${esc(mName(c,s.member))}</b> – ${esc(s.reason)}${s.note?`<div class="small muted">${esc(s.note)}</div>`:''}</span><span class="small ${exp?'muted':''}">${exp?'wygasło':'+'+(s.pts||1)}</span><button class="iconbtn" data-act="sdel" data-id="${s.id}" aria-label="Usuń wpis">✕</button></div>`}).join('')}</div>`:'<div class="empty">Brak wpisów.</div>'}
    </div>
  </div>`;
}

/* ---------- Igrzyska i Raidy ---------- */
function vEvents(c){
  const ms=members(c).slice().sort((a,b)=>a.name.localeCompare(b.name,'pl'));const st=c.settings;
  const cgSum=ms.reduce((a,m)=>a+Math.min(CG_PLAYER_MAX,Number(c.games.pts[m.id])||0),0);
  const tier=CG_TIERS.filter(t=>cgSum>=t).length;
  const cg=cgInfo(),rd=raidInfo();
  const raidSum=ms.reduce((a,m)=>a+(Number(c.raid.gold[m.id])||0),0);
  const raidAtt=ms.reduce((a,m)=>a+(Number(c.raid.att[m.id])||0),0);
  const cgOk=ms.filter(m=>(c.games.pts[m.id]||0)>=st.cgTarget).length;
  return `
  <div class="pagehead"><div><h2>Igrzyska Klanowe i Raid Weekend</h2><p>${PUBLIC||c.syncedAt?'Wyniki z gry – kto już zrobił swoje, a komu jeszcze brakuje.':'Wpisz wyniki z gry – panel pokaże, kto nie dobił do minimum.'}</p></div></div>
  <div class="grid g2" style="align-items:start">
    <div class="card"><h3>Igrzyska Klanowe<span class="sub">${cg.active?'trwają · koniec za '+rel(cg.end-Date.now()):'następne '+fmtDate(cg.start)}</span></h3>
      <div class="row" style="margin-bottom:12px;align-items:center"><label class="f" style="flex:0 1 140px">Sezon<input type="text" id="cg-season" data-ch="gset" data-f="season" value="${esc(c.games.season)}"></label>
        <div style="flex:1 1 200px"><div class="small muted" style="display:flex;justify-content:space-between"><span>Klan: <b class="num" style="color:var(--ink)">${cgSum.toLocaleString('pl-PL')}</b> / ${CG_CLAN_MAX.toLocaleString('pl-PL')}</span><span>Poziom ${tier}/6</span></div><div class="bar" style="margin-top:5px"><i style="width:${Math.min(100,cgSum/CG_CLAN_MAX*100)}%"></i></div></div>
        <button class="btn sm" data-act="greset">Nowe Igrzyska</button></div>
      <div class="small muted" style="margin-bottom:8px">${cgOk}/${ms.length} graczy ma min. ${st.cgTarget} pkt (próg nagrody bonusowej).</div>
      <div class="tablewrap"><table><thead><tr><th>Gracz</th><th class="n">Punkty</th><th style="width:40%">Postęp do ${st.cgTarget}</th></tr></thead><tbody>
      ${ms.map(m=>{const p=Number(c.games.pts[m.id])||0;return `<tr><td>${esc(m.name)}</td><td class="n"><input type="number" min="0" max="${CG_PLAYER_MAX}" step="50" id="cg-${m.id}" data-ch="gpts" data-id="${m.id}" value="${p||''}" placeholder="0"></td><td><div class="bar ${p>=st.cgTarget?'ok':''}"><i style="width:${Math.min(100,p/st.cgTarget*100)}%"></i></div></td></tr>`}).join('')}
      </tbody></table></div></div>
    <div class="card"><h3>Raid Weekend<span class="sub">${rd.active?'trwa · koniec za '+rel(rd.end-Date.now()):'następny '+fmtDT(rd.start)}</span></h3>
      <div class="row" style="margin-bottom:12px;align-items:center"><label class="f" style="flex:0 1 160px">Weekend od<input type="date" id="rd-week" data-ch="rset" data-f="week" value="${esc(c.raid.week)}"></label>
        <div style="flex:1"><div class="small muted">Złoto stolicy: <b class="num" style="color:var(--ink)">${raidSum.toLocaleString('pl-PL')}</b> · ataki ${raidAtt}/${ms.length*st.raidAttacks}</div></div>
        <button class="btn sm" data-act="rreset">Nowy weekend</button></div>
      <div class="tablewrap"><table><thead><tr><th>Gracz</th><th class="c">Ataki</th><th class="n">Złoto stolicy</th></tr></thead><tbody>
      ${ms.map(m=>{const a=Number(c.raid.att[m.id])||0;return `<tr><td>${esc(m.name)}</td><td class="c"><select id="rd-a-${m.id}" data-ch="ratt" data-id="${m.id}" class="${a<st.raidAttacks?'':'v3'}">${Array.from({length:st.raidAttacks+1},(_,i)=>`<option value="${i}" ${a===i?'selected':''}>${i}/${st.raidAttacks}</option>`).join('')}</select> ${a>=st.raidAttacks?'<span class="pill ok">✓</span>':a>0?'<span class="pill warn">brak '+(st.raidAttacks-a)+'</span>':''}</td><td class="n"><input type="number" min="0" step="100" id="rd-g-${m.id}" data-ch="rgold" data-id="${m.id}" value="${c.raid.gold[m.id]||''}" placeholder="0" style="width:96px"></td></tr>`}).join('')}
      </tbody></table></div></div>
  </div>`;
}

/* ---------- Ogłoszenia ---------- */
const TPLS=[['warstart','Start wojny'],['warplan','Plan ataków (cele)'],['remind','Przypomnienie o atakach'],['cwlround','CWL – skład rundy'],['cwlbonus','CWL – bonusy'],['cg','Igrzyska – kto poniżej minimum'],['raid','Raid – wolne ataki'],['strikes','Lista ostrzeżeń'],['rules','Zasady klanu'],['recruit','Rekrutacja']];
function tplText(c,id,opt){
  const st=c.settings,w=c.war,n=st.name;
  switch(id){
    case 'warstart':{if(!w)return '(Brak aktywnej wojny – zaplanuj ją w zakładce Wojna)';
      return `⚔️ WOJNA: ${n} vs ${w.enemy} (${w.size}v${w.size})\n⏰ Koniec bitwy: ${fmtDT(w.end)}\n1️⃣ Pierwszy atak: swoje lustro (Twój numer na mapie), w ciągu 12 h.\n2️⃣ Drugi atak: czyszczenie według planu – pytaj na czacie.\n🏰 Zamek pełny, bohaterowie nie w ulepszaniu.\n❗ Nieużyty atak = ostrzeżenie. Powodzenia!`}
    case 'warplan':{if(!w)return '(Brak aktywnej wojny)';
      const lines=w.lineup.map((id,i)=>{if(!id)return null;const a=w.att[id]||[];const t=a.map(x=>x&&x.t?'#'+x.t:'?').join(' / ');return `${i+1}. ${mName(c,id)} → ${t}`}).filter(Boolean);
      return `📋 PLAN vs ${w.enemy}\n${lines.join('\n')}\n(cel 1. ataku / 2. ataku)`}
    case 'remind':{if(!w)return '(Brak aktywnej wojny)';
      const left=w.lineup.filter(Boolean).map(id=>{const n2=(w.att[id]||[{},{}]).filter(x=>!x||x.s==null).length;return n2?`${mName(c,id)} (${n2})`:null}).filter(Boolean);
      const t=new Date(w.end).getTime()-Date.now();
      return left.length?`📣 Do końca wojny: ${t>0?rel(t):'koniec'}!\nBrakujące ataki: ${left.join(', ')}\nNie zostawiajcie gwiazdek na stole 💪`:'✅ Wszyscy wykonali ataki – dzięki!'}
    case 'cwlround':{const r=c.cwl.rounds[opt-1];if(!r)return '';
      const ids=Object.entries(r.cells).filter(([,v])=>v).map(([id])=>id);
      const names=ids.map(id=>mById(c,id)).filter(Boolean).sort((a,b)=>b.th-a.th).map(m=>m.name);
      return `🏆 CWL – runda ${opt}${r.enemy?' vs '+r.enemy:''}\nSkład (${names.length}): ${names.join(', ')||'– jeszcze nie ustalony –'}\n⚔️ 1 atak na wojnę – na swoje lustro, chyba że plan mówi inaczej.\n❗ Nieużyty atak w CWL = ostrzeżenie i brak bonusu.`}
    case 'cwlbonus':{const rank=cwlRank(c).filter(x=>x.miss===0).slice(0,Number(c.cwl.bonuses)||0);
      return `🎖 Bonusy CWL ${c.cwl.season}${c.cwl.league?' ('+c.cwl.league+')':''}:\n${rank.map((x,i)=>`${i+1}. ${mName(c,x.id)} – ${x.stars}★ w ${x.att} atakach`).join('\n')||'– brak –'}\nGratulacje i dzięki wszystkim za walkę!`}
    case 'cg':{const low=members(c).filter(m=>(c.games.pts[m.id]||0)<st.cgTarget).map(m=>`${m.name} (${c.games.pts[m.id]||0})`);
      const sum=members(c).reduce((a,m)=>a+Math.min(CG_PLAYER_MAX,c.games.pts[m.id]||0),0);
      return `🎯 Igrzyska Klanowe: mamy ${sum.toLocaleString('pl-PL')} / ${CG_CLAN_MAX.toLocaleString('pl-PL')} pkt.\n${low.length?`Poniżej ${st.cgTarget}: ${low.join(', ')}`:'Wszyscy mają minimum – super!'}`}
    case 'raid':{const low=members(c).filter(m=>(c.raid.att[m.id]||0)<st.raidAttacks).map(m=>`${m.name} (${c.raid.att[m.id]||0}/${st.raidAttacks})`);
      return `🏰 Raid Weekend – ${low.length?`zostały ataki: ${low.join(', ')}`:'wszystkie ataki wykonane, dzięki!'}`}
    case 'strikes':{const l=members(c).map(m=>({m,p:strikePts(c,m.id)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p);
      return `⚠️ Ostrzeżenia (limit ${st.strikeLimit}):\n${l.map(x=>`${x.m.name}: ${x.p}`).join('\n')||'Brak – dobra robota!'}`}
    case 'rules':return `📜 ZASADY ${n}\n${c.rules}`;
    case 'recruit':{const mc=members(c).length;
      return S.cur==='academy'
        ?`🎓 ${n} ${st.tag} – akademia ${S.clans.main.settings.name}! Uczymy ataków, gramy wojny i CWL. TH${st.minTH}+ mile widziani. Najlepsi awansują do klanu głównego. Wolnych miejsc: ${50-mc}.`
        :`⚔️ ${n} ${st.tag} szuka aktywnych graczy TH${st.minTH}+! Wojny co tydzień, CWL co miesiąc, Igrzyska i Raidy na maksa. Mamy akademię dla młodszych. Wolnych miejsc: ${50-mc}.`}
  }
  return '';
}

let modalOnClose=null;
function openModal(html){const r=document.getElementById('modalRoot');r.innerHTML=`<div class="modal-bg" data-act="bgclose"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=r.querySelector('input,select,textarea,button');if(f)f.focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function confirmModal(title,text,okLabel,fn,danger=true){
  openModal(`<h3>${title}</h3><p>${text}</p><div class="foot"><button class="btn ghost" data-act="close">Anuluj</button><button class="btn ${danger?'danger':'pri'}" data-act="confirmok">${okLabel}</button></div>`);
  modalOnClose=fn;
}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Skopiowano')}catch(e){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Skopiowano':'Zaznacz tekst i skopiuj ręcznie (Ctrl+C)')}
}

  wline(d,el){const c=C(),w=c.war;const i=Number(d.i);const id=el.value||null;
    if(id){const j=w.lineup.indexOf(id);if(j>=0&&j!==i)w.lineup[j]=w.lineup[i]}
    w.lineup[i]=id;if(id&&!w.att[id])w.att[id]=[{t:i+1,s:null,d:null},{t:null,s:null,d:null}];commit()},
  watt(d,el){const w=C().war;const a=w.att[d.id]||(w.att[d.id]=[{t:null,s:null,d:null},{t:null,s:null,d:null}]);const j=Number(d.j);a[j]=a[j]||{t:null,s:null,d:null};
    const v=el.value===''?null:Number(el.value);
    if(d.f==='t')a[j].t=v;if(d.f==='s'){a[j].s=v;if(v===3)a[j].d=100;}if(d.f==='d')a[j].d=v==null?null:clampNum(v,0,100);commit()},
  eth(d,el){const w=C().war;w.enemyTH[Number(d.i)]=el.value?Number(el.value):null;commit()},
  wenemy(d,el){const w=C().war;w[d.f]=el.value===''?0:Math.max(0,Number(el.value));commit()},
  hrange(d,el){UI.hRange=Number(el.value);render()},
  cwlset(d,el){const cw=C().cwl;cw[d.f]=(d.f==='size'||d.f==='bonuses')?clampNum(el.value,0,50):el.value;commit()},
  cwlsort(d,el){UI.cwlSort=el.value;render()},
  cwlround(d,el){C().cwl.rounds[Number(d.i)][d.f]=el.value;commit()},
  cwlcell(d,el){const r=C().cwl.rounds[Number(d.i)];if(el.value)r.cells[d.id]=el.value;else delete r.cells[d.id];commit()},
  gset(d,el){C().games[d.f]=el.value;commit()},
  gpts(d,el){const g=C().games;const v=el.value===''?0:clampNum(el.value,0,CG_PLAYER_MAX);if(v)g.pts[d.id]=v;else delete g.pts[d.id];commit()},
  rset(d,el){C().raid[d.f]=el.value;commit()},
  ratt(d,el){C().raid.att[d.id]=Number(el.value);commit()},
  rgold(d,el){const v=el.value===''?0:clampNum(el.value,0,1e7);C().raid.gold[d.id]=v;commit()},
  set(d,el){const st=C().settings;const num=!['name','tag'].includes(d.f);st[d.f]=num?clampNum(el.value,0,100000):el.value.trim();if(d.f==='name'&&!st.name)st.name=S.cur==='main'?'Mój klan':'Moja Akademia';commit()},
  rules(d,el){C().rules=el.value;commit()},
  tplopt(d,el){UI.tplOpt=Number(el.value);UI.tplText=null;render()}
};
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset&&el.dataset.ch;if(k&&CH[k])CH[k](el.dataset,el)});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.in;
  if(k==='msearch'){UI.mSearch=el.value;render()}
  if(k==='tpltext'){UI.tplText=el.value;const cc=document.getElementById('tpl-count');if(cc)cc.textContent=el.value.length+' znaków'}
});
document.addEventListener('submit',e=>{
  const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
  const c=C();const fd=new FormData(f);const g=n=>(fd.get(n)??'').toString().trim();
  if(k==='todo'){const t=document.getElementById('todo-new').value.trim();if(!t)return;c.todos.push({id:uid(),text:t,done:false});commit();return}
  if(k==='member'){
    const isNew=!!f.dataset.new;let m=isNew?{id:f.dataset.id,status:'active'}:mById(c,f.dataset.id);if(!m)return;
    if(!g('name')){toast('Wpisz nick gracza');return}
    Object.assign(m,{name:g('name'),tag:g('tag').toUpperCase(),th:Number(g('th')),role:g('role'),warPref:g('warPref'),don:clampNum(g('don'),0,1e7),rec:clampNum(g('rec'),0,1e7),joined:g('joined'),lastSeen:g('lastSeen'),notes:g('notes')});
    m.heroes={};HEROES.forEach(([h])=>m.heroes[h]=clampNum(g('h_'+h),0,200));
    if(!isNew)m.status=fd.get('left')?'left':'active';
    if(isNew)c.members.push(m);
    if(m.status==='left'&&c.war)c.war.lineup=c.war.lineup.map(x=>x===m.id?null:x);
    closeModal();commit();toast(isNew?'Dodano gracza':'Zapisano');return}
  if(k==='bulk'){
    const lines=g('list').split('\n').map(l=>l.trim()).filter(Boolean);let n=0;
    lines.forEach(l=>{const p=l.split(/[;,\t]/).map(x=>x.trim());if(!p[0])return;const th=clampNum(String(p[1]||'').replace(/\D/g,'')||c.settings.minTH,1,c.settings.maxTH);
      c.members.push({id:uid(),name:p[0],tag:(p[2]||'').toUpperCase(),th,role:'member',heroes:{},warPref:'in',don:0,rec:0,joined:todayISO(),lastSeen:todayISO(),notes:'',status:'active'});n++});
    closeModal();commit();toast('Dodano graczy: '+n);return}
  if(k==='newwar'){
    const size=Number(g('size'));const endV=g('end');const end=endV?new Date(endV):new Date(Date.now()+47*36e5);
    const lineup=fd.get('auto')?autoLineup(c,size):Array(size).fill(null);const att={};
    lineup.forEach((id,i)=>{if(id)att[id]=[{t:fd.get('mirror')?i+1:null,s:null,d:null},{t:null,s:null,d:null}]});
    c.war={id:uid(),enemy:g('enemy')||'Przeciwnik',enemyTag:g('enemyTag').toUpperCase(),size,type:'normal',start:new Date().toISOString(),end:end.toISOString(),lineup,enemyTH:Array(size).fill(null),enemyNote:[],att,enemyStars:0,enemyPct:0};
    commit();return}
  if(k==='endwar'){
    const w=c.war;const h=archiveWar(c,S.cur,w,false);
    w.lineup.filter(Boolean).forEach(id=>{if(fd.get('strike_'+id))c.strikes.push({id:uid(),member:id,reason:'Nieużyty atak w wojnie',pts:1,date:todayISO(),note:'vs '+w.enemy})});
    c.war=null;closeModal();putHistory(h);commit();toast('Wojna zapisana w historii');return}
  if(k==='strike'){
    if(!g('member')){toast('Wybierz gracza');return}
    c.strikes.push({id:uid(),member:g('member'),reason:g('reason'),pts:clampNum(g('pts'),1,5),date:g('date')||todayISO(),note:g('note')});commit();toast('Dodano ostrzeżenie');return}
  if(k==='cwlpool'){
    c.cwl.pool=members(c).filter(m=>fd.get('p_'+m.id)).map(m=>m.id);closeModal();commit();return}
  if(k==='import'){
    try{const o=JSON.parse(g('json'));if(!o||!o.clans)throw 0;
      S.clans.main=normalize(o.clans.main,'main');S.clans.academy=normalize(o.clans.academy,'academy');S.demo=false;closeModal();
      (o.history||[]).forEach(h=>{if(h&&h.id&&h.clan)putHistory(h)});commit('main');commit('academy');toast('Wczytano kopię')}
    catch(err){toast('To nie wygląda na kopię z tego panelu')}
    return}
});

boot();
</script>
</body>
